[workspace]
resolver = "2"
members = ["typelogic-core", "typelogic-py", "typelogic-node", "typelogic-lua", "typelogic-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.83"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
