[package]
name = "typelogic-py"
description = "PyO3 bindings of typelogic-core (Python module typelogic._core, built with maturin)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
typelogic-core = { path = "../typelogic-core" }
# abi3: one wheel for CPython 3.10+ (the portable Windows runtime is 3.12).
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
# Windows without python3.lib (e.g. the embeddable runtime): let PyO3 generate the import library.
generate-import-lib = ["pyo3/generate-import-lib"]
