# Build the Rust core as the Python extension `typelogic._core` with maturin:
#   pip install maturin && maturin develop --release        (into the active environment)
#   maturin build --release                                  (wheel in rust/target/wheels)
# The application also runs without the extension: typelogic/core.py falls back to the Python reference.
[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "typelogic-ai"
version = "1.1.0"
description = "Local, offline structured decisions with typed probabilistic answers (Qwen3.5-2B decision head + Rust core)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
model = ["torch>=2.8", "transformers>=5.18", "peft>=0.21", "safetensors>=0.8", "huggingface-hub>=1.33", "onnx>=1.23", "onnxruntime>=1.30"]
test = ["pytest>=9"]

[project.scripts]
typelogic = "typelogic.cli:main"

[tool.maturin]
manifest-path = "rust/typelogic-py/Cargo.toml"
module-name = "typelogic._core"
python-packages = ["typelogic"]
features = ["pyo3/extension-module"]
profile = "release"
